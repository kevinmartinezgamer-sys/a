<style>

<body>

<script>
// ══════════════════════════════════════════════════════════════
// MOTOR DE SONIDOS
// ══════════════════════════════════════════════════════════════
const AudioEngine={ctx:null,volume:0.7,init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();const saved=localStorage.getItem('mary_game_progress');if(saved){const data=JSON.parse(saved);this.volume=(data.volume||70)/100;}}catch(e){console.warn('Audio no disponible');}},play(type){if(!this.ctx)return;switch(type){case'jump':this.playJump();break;case'coin':this.playCoin();break;case'die':this.playDie();break;case'win':this.playWin();break;}},playJump(){const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);osc.frequency.setValueAtTime(300,this.ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(600,this.ctx.currentTime+0.1);gain.gain.setValueAtTime(this.volume*0.3,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.15);osc.start(this.ctx.currentTime);osc.stop(this.ctx.currentTime+0.15);},playCoin(){const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);osc.frequency.setValueAtTime(800,this.ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1200,this.ctx.currentTime+0.05);gain.gain.setValueAtTime(this.volume*0.25,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.1);osc.start(this.ctx.currentTime);osc.stop(this.ctx.currentTime+0.1);},playDie(){const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);osc.frequency.setValueAtTime(400,this.ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(50,this.ctx.currentTime+0.4);gain.gain.setValueAtTime(this.volume*0.4,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.4);osc.start(this.ctx.currentTime);osc.stop(this.ctx.currentTime+0.4);},playWin(){const notes=[523,659,784,1047];notes.forEach((freq,i)=>{const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);osc.frequency.setValueAtTime(freq,this.ctx.currentTime+i*0.15);gain.gain.setValueAtTime(this.volume*0.3,this.ctx.currentTime+i*0.15);gain.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+i*0.15+0.3);osc.start(this.ctx.currentTime+i*0.15);osc.stop(this.ctx.currentTime+i*0.15+0.3);});}};
document.addEventListener('click',()=>{if(!AudioEngine.ctx)AudioEngine.init();},{once:true});

// ══════════════════════════════════════════════════════════════
// SISTEMA DE PROGRESO
// ══════════════════════════════════════════════════════════════
function saveProgress(level,coins){const data=JSON.parse(localStorage.getItem('mary_game_progress')||'{}');data.maxLevel=Math.max(data.maxLevel||1,level+1);data.coins=coins;data.volume=data.volume||70;localStorage.setItem('mary_game_progress',JSON.stringify(data));}
function loadProgress(){return JSON.parse(localStorage.getItem('mary_game_progress')||'{"maxLevel":1,"coins":0,"volume":70}');}

// ══════════════════════════════════════════════════════════════
// CANVAS Y CONFIGURACIÓN
// ══════════════════════════════════════════════════════════════
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const NW=800,NH=420;
function resize(){const w=document.getElementById('canvas-wrap');const s=Math.min(w.clientWidth/NW,w.clientHeight/NH);canvas.width=NW;canvas.height=NH;canvas.style.width=Math.floor(NW*s)+'px';canvas.style.height=Math.floor(NH*s)+'px';}
resize();window.addEventListener('resize',resize);

// ══════════════════════════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════════════════════════
const INPUT={left:false,right:false,jump:false,down:false};
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();syncKeys();});
document.addEventListener('keyup',e=>{keys[e.code]=false;syncKeys();});
function syncKeys(){INPUT.left=!!(keys['ArrowLeft']||keys['KeyA']);INPUT.right=!!(keys['ArrowRight']||keys['KeyD']);INPUT.jump=!!(keys['ArrowUp']||keys['Space']||keys['KeyW']);INPUT.down=!!(keys['ArrowDown']||keys['KeyS']);}
function bindBtn(id,prop){const el=document.getElementById(id);const on=()=>{INPUT[prop]=true;el.classList.add('pressed');};const off=()=>{INPUT[prop]=false;el.classList.remove('pressed');};el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});el.addEventListener('touchcancel',e=>{e.preventDefault();off();},{passive:false});el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}
bindBtn('btn-left','left');bindBtn('btn-right','right');bindBtn('btn-jump','jump');bindBtn('btn-down','down');

// ══════════════════════════════════════════════════════════════
// CONSTANTES FÍSICAS

const LEVELS={
1:{title:"EL JARDÍN DE<br>LOS RECUERDOS",subtitle:'"Papá solía llevarme aquí…"',winMsg:'"El jardín ya no es el mismo.<br>Pero los recuerdos permanecen."',worldW:3600,goalX:3540,dialogs:[{t:'"Papá solía llevarme aquí cada domingo.\nDecía que las flores eran como recuerdos:\nfrágiles, pero hermosos."',cam:0,sh:false},{t:'"Mamá dejó de venir después.\nDijo que dolía demasiado.\nPero yo nunca dejé de recordar."',cam:900,sh:false},{t:'"Cada flor que veo\nme recuerda su sonrisa.\nY sigo adelante."',cam:1900,sh:false},{t:'"Ya casi llego al final del jardín.\nPapá, ¿me estás viendo?"',cam:2900,sh:false}],build:()=>{W.plats=[];W.coins=[];W.enemies=[];[[0,300],[380,200],[660,200],[940,220],[1240,200],[1520,200],[1800,220],[2100,200],[2380,200],[2660,220],[2960,200],[3240,360]].forEach(([x,w])=>W.plats.push({x,y:GY,w,h:GH,t:'g'}));[[310,GY-85,80],[590,GY-85,80],[870,GY-95,80],[1150,GY-80,80],[1430,GY-85,80],[1710,GY-80,70],[1990,GY-85,80],[2270,GY-95,80],[2550,GY-80,80],[2830,GY-80,80],[3110,GY-75,80]].forEach(([x,y,w])=>W.plats.push({x,y,w,h:14,t:'p'}));for(let i=0;i<12;i++){const sx=40+i*280;for(let k=0;k<3;k++)W.coins.push({x:sx+28+k*22,y:GY-CH,col:false,an:i*0.6+k*0.3});}W.plats.filter(p=>p.t==='p').forEach((p,i)=>{W.coins.push({x:p.x+p.w/2-12,y:p.y-CH,col:false,an:i*0.4});W.coins.push({x:p.x+p.w/2+12,y:p.y-CH,col:false,an:i*0.4+0.4});});W.goal={x:3540,y:GY};W.worldW=3600;}},

3:{title:"LA CIUDAD<br>GRIS",subtitle:'"Mamá trabaja aquí ahora…"',winMsg:'"La ciudad es ruidosa y fría.<br>Pero mamá dice que es nuestro hogar ahora."',worldW:3800,goalX:3720,dialogs:[{t:'"Mamá trabaja aquí ahora.\nDice que es temporal.\nPero ya llevamos dos años."',cam:0,sh:false},{t:'"Los edificios son tan altos\nque no puedo ver el cielo.\nPapá amaba el cielo."',cam:900,sh:false},{t:'"A veces escucho el tren\ny pienso que es él que regresa.\nPero nunca es él."',cam:2100,sh:false},{t:'"La estación está cerca.\nTengo que llegar."',cam:3100,sh:false}],build:()=>{W.plats=[];W.coins=[];W.enemies=[];[[0,300],[390,200],[770,190],[1140,210],[1520,200],[1900,180],[2270,210],[2650,190],[3020,200],[3400,200]].forEach(([x,w])=>W.plats.push({x,y:GY,w,h:GH,t:'g'}));for(let i=0;i<20;i++){const x=200+i*180;const y=GY-80-(i%4)*15;W.plats.push({x,y,w:90,h:14,t:'p'});}[{x:60,mn:10,mx:280,sp:.85},{x:420,mn:390,mx:570,sp:.9},{x:800,mn:770,mx:950,sp:.85},{x:1170,mn:1140,mx:1380,sp:.9},{x:1550,mn:1520,mx:1760,sp:.85},{x:1930,mn:1900,mx:2130,sp:.9},{x:2300,mn:2270,mx:2510,sp:.85},{x:2680,mn:2650,mx:2880,sp:.9},{x:3050,mn:3020,mx:3260,sp:.85},{x:3430,mn:3400,mx:3650,sp:.9}].forEach(e=>W.enemies.push({x:e.x,y:GY-24,w:20,h:24,mn:e.mn,mx:e.mx,sp:e.sp,dr:1,an:0,at:0}));for(let i=0;i<15;i++){const x=100+i*240;W.coins.push({x,y:GY-CH,col:false,an:i*0.7});}W.plats.filter(p=>p.t==='p').forEach((p,i)=>{if(i%2===0)W.coins.push({x:p.x+p.w/2,y:p.y-CH,col:false,an:i*0.5});});W.goal={x:3720,y:GY};W.worldW=3800;}},
4:{title:"CIUDAD<br>BAJO LLUVIA",subtitle:'"Mamá ya no hablaba de él…"',winMsg:'"La lluvia no para.<br>Pero Mary tampoco."',worldW:3800,goalX:3720,dialogs:[{t:'"Mamá ya no hablaba de él.\nDespués del segundo invierno\nsimplemente dejó de decir su nombre."',cam:0,sh:false},{t:'"Llueve igual que esa noche.\nCuando llegó el telegrama.\nMamá lo leyó sola."',cam:900,sh:false},{t:'"Yo nunca lo dejé de esperar.\nCada tren que llegaba\npodía ser el suyo."',cam:2100,sh:false},{t:'"Pero hoy llegó una carta.\nY tengo miedo de lo que dice.\nCorre, Mary. Corre."',cam:3100,sh:false}],build:()=>{W.plats=[];W.coins=[];W.enemies=[];[[0,300],[390,200],[680,190],[960,170],[1220,210],[1530,180],[1820,200],[2120,180],[2400,200],[2700,180],[2980,210],[3290,180],[3570,230]].forEach(([x,w])=>W.plats.push({x,y:GY,w,h:60,t:'g'}));[[305,GY-95,75],[510,GY-80,70],[600,GY-110,70],[765,GY-90,75],[880,GY-80,70],[1080,GY-100,75],[1155,GY-85,70],[1345,GY-95,75],[1460,GY-82,70],[1640,GY-105,75],[1755,GY-88,70],[1940,GY-95,75],[2055,GY-82,70],[2240,GY-105,75],[2345,GY-88,70],[2520,GY-95,75],[2625,GY-80,70],[2820,GY-108,70],[2920,GY-90,75],[3100,GY-95,75],[3215,GY-82,70],[3400,GY-108,75],[3510,GY-90,70]].forEach(([x,y,w])=>W.plats.push({x,y,w,h:12,t:'p'}));[{x:60,mn:10,mx:280,sp:.85},{x:420,mn:390,mx:570,sp:.9},{x:710,mn:680,mx:850,sp:.85},{x:990,mn:960,mx:1190,sp:.9},{x:1250,mn:1220,mx:1490,sp:.85},{x:1560,mn:1530,mx:1780,sp:.9},{x:1850,mn:1820,mx:2080,sp:.85},{x:2150,mn:2120,mx:2360,sp:.9},{x:2430,mn:2400,mx:2650,sp:.85},{x:2730,mn:2700,mx:2950,sp:.9},{x:3010,mn:2980,mx:3250,sp:.85},{x:3600,mn:3570,mx:3750,sp:.9}].forEach(e=>W.enemies.push({x:e.x,y:GY-24,w:20,h:24,mn:e.mn,mx:e.mx,sp:e.sp,dr:1,an:0,at:0}));[{x:360,y:GY-CH},{x:650,y:GY-CH},{x:930,y:GY-CH},{x:1190,y:GY-CH},{x:1500,y:GY-CH},{x:1792,y:GY-CH},{x:2092,y:GY-CH},{x:2372,y:GY-CH},{x:2672,y:GY-CH},{x:2952,y:GY-CH},{x:3262,y:GY-CH},{x:3542,y:GY-CH}].forEach((c,i)=>W.coins.push({...c,col:false,an:i*.7}));W.goal={x:3720,y:GY};W.worldW=3800;}},

// FUNCIONES DE NIVEL
// ══════════════════════════════════════════════════════════════
function loadLevel(num){currentLevel=num;const lvl=LEVELS[num];document.getElementById('level-tag').textContent=`NIVEL ${num}`;document.getElementById('level-title').innerHTML=lvl.title;document.getElementById('level-subtitle').innerHTML=lvl.subtitle;document.getElementById('hud-level').textContent=num;lvl.build();P.x=40;P.y=300;P.vx=0;P.vy=0;P.dead=false;P.inv=0;P.jLock=false;camX=0;won=false;gState='title';document.getElementById('title').style.display='flex';document.getElementById('win-screen').style.display='none';}
function startGame(){document.getElementById('title').style.display='none';gState='playing';updateHUD();const lvl=LEVELS[currentLevel];if(lvl.dialogs&&lvl.dialogs.length>0){setTimeout(()=>{if(gState==='playing'){lvl.dialogs[0].sh=true;openDlg(lvl.dialogs[0].t);}},600);}requestAnimationFrame(loop);}
function triggerWin(){won=true;gState='won';spawnP(P.x+9,P.y,'#f4c542',22);if(AudioEngine&&AudioEngine.ctx)AudioEngine.play('win');saveProgress(currentLevel,coinsN);setTimeout(()=>{const lvl=LEVELS[currentLevel];document.getElementById('win-title').textContent=`¡NIVEL ${currentLevel} COMPLETO!`;document.getElementById('win-message').innerHTML=lvl.winMsg;document.getElementById('win-screen').style.display='flex';if(currentLevel<5){document.getElementById('continue-text').textContent='Cargando Nivel '+(currentLevel+1)+'...';setTimeout(()=>{loadLevel(currentLevel+1);setTimeout(startGame,500);},2000);}else{document.getElementById('continue-text').textContent='✦ FIN DEL JUEGO ✦';}},800);}

// ══════════════════════════════════════════════════════════════
// DIÁLOGOS
// ══════════════════════════════════════════════════════════════
let dlgTxt='',dlgCh=0,dlgT=0,dlgJL=false;
function chkDlg(){const lvl=LEVELS[currentLevel];if(!lvl.dialogs)return;lvl.dialogs.forEach(d=>{if(!d.sh&&camX>=d.cam){d.sh=true;openDlg(d.t);}});}
function openDlg(t){gState='dialog';dlgTxt=t;dlgCh=0;dlgT=0;document.getElementById('dialog').style.display='block';document.getElementById('dtxt').textContent='';}
function advanceDialog(){if(dlgCh<dlgTxt.length){dlgCh=dlgTxt.length;document.getElementById('dtxt').textContent=dlgTxt;}else{gState='playing';document.getElementById('dialog').style.display='none';}}
function tickDlg(){dlgT++;if(dlgT%2===0&&dlgCh<dlgTxt.length){dlgCh++;document.getElementById('dtxt').textContent=dlgTxt.slice(0,dlgCh);}if(INPUT.jump&&!dlgJL){dlgJL=true;advanceDialog();}if(!INPUT.jump)dlgJL=false;}
document.getElementById('canvas-wrap').addEventListener('click',()=>{if(gState==='title')startGame();if(gState==='dialog')advanceDialog();});
document.getElementById('start-tap').addEventListener('click',startGame);

// ══════════════════════════════════════════════════════════════
// PARTÍCULAS
// ══════════════════════════════════════════════════════════════
function spawnP(x,y,col,n=6){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*3.5,vy:(Math.random()-.5)*3.5-1,col:col||['#7ad045','#50b030','#f4c542','#c8f090'][Math.floor(Math.random()*4)],sz:3+Math.random()*3,life:28,max:28});}
function tickParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;if(p.life<=0)parts.splice(i,1);}}

// ══════════════════════════════════════════════════════════════
// COLISIONES
// ══════════════════════════════════════════════════════════════
function ov(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function resolveCol(){P.onGround=false;for(const pl of W.plats){if(!ov(P.x,P.y,P.w,P.h,pl.x,pl.y,pl.w,pl.h))continue;const oL=P.x+P.w-pl.x,oR=pl.x+pl.w-P.x,oT=P.y+P.h-pl.y,oB=pl.y+pl.h-P.y;if(Math.min(oT,oB)<Math.min(oL,oR)){if(oT<oB){P.y=pl.y-P.h;P.vy=0;P.onGround=true;}else{P.y=pl.y+pl.h;P.vy=Math.max(P.vy,1);}}else{if(oL<oR){P.x=pl.x-P.w;P.vx=0;}else{P.x=pl.x+P.w;P.vx=0;}}}}

// ══════════════════════════════════════════════════════════════
// MUERTE / RESPAWN
// ══════════════════════════════════════════════════════════════
function die(){if(P.dead||P.inv>0)return;P.dead=true;P.rT=85;P.vx=0;P.vy=0;lives=Math.max(0,lives-1);spawnP(P.x+9,P.y+13,'#e04040',14);if(AudioEngine&&AudioEngine.ctx)AudioEngine.play('die');updateHUD();}
function respawn(){P.x=40;P.y=GY-P.h-4;P.vx=0;P.vy=0;P.dead=false;P.jLock=false;P.inv=180;if(lives<=0){lives=3;coinsN=0;camX=0;loadLevel(1);updateHUD();}}
function updateHUD(){document.getElementById('hcoins').textContent=coinsN;document.getElementById('hlives').textContent='❤'.repeat(lives);}

// ══════════════════════════════════════════════════════════════
// ACTUALIZAR JUGADOR
// ══════════════════════════════════════════════════════════════
function update(){if(P.dead){if(--P.rT<=0)respawn();return;}if(P.inv>0)P.inv--;const spd=P.onGround?SPD:SPD*0.88;if(INPUT.left){P.vx=-spd;P.dir=-1;}else if(INPUT.right){P.vx=spd;P.dir=1;}else P.vx*=0.74;if(INPUT.jump&&!P.jLock&&P.onGround){P.vy=JUMP_F;P.jLock=true;spawnP(P.x+9,P.y+P.h,'#7ad045',4);if(AudioEngine&&AudioEngine.ctx)AudioEngine.play('jump');}if(!INPUT.jump)P.jLock=false;P.vy=Math.min(P.vy+GRAV,17);P.x+=P.vx;P.y+=P.vy;resolveCol();P.x=Math.max(0,Math.min(P.x,W.worldW-P.w));if(P.y>NH+30&&P.inv===0)die();W.coins.forEach(c=>{if(!c.col&&ov(P.x,P.y,P.w,P.h,c.x-10,c.y-10,20,20)){c.col=true;coinsN++;spawnP(c.x,c.y,'#f4c542',5);if(AudioEngine&&AudioEngine.ctx)AudioEngine.play('coin');updateHUD();}});W.enemies.forEach(e=>{e.x+=e.sp*e.dr;if(e.x<=e.mn){e.x=e.mn;e.dr=1;}if(e.x+e.w>=e.mx){e.x=e.mx-e.w;e.dr=-1;}if(++e.at>9){e.at=0;e.an=(e.an+1)%4;}if(!P.dead&&P.inv===0&&ov(P.x,P.y,P.w,P.h,e.x,e.y,e.w,e.h))die();});if(!won&&P.x+P.w>W.goal.x&&P.y+P.h>W.goal.y-10)triggerWin();if(Math.abs(P.vx)>0.3){if(++P.aT>7){P.aT=0;P.aF++;}}camX=Math.max(0,Math.min(P.x-280,W.worldW-NW));if(gState==='playing')chkDlg();}

// ══════════════════════════════════════════════════════════════
// DIBUJO
// ══════════════════════════════════════════════════════════════
function sx(x){return Math.round(x-camX);}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,NH);g.addColorStop(0,'#061208');g.addColorStop(.6,'#0d2210');g.addColorStop(1,'#1a3a18');ctx.fillStyle=g;ctx.fillRect(0,0,NW,NH);}
function drawGround(){ctx.fillStyle='#020602';ctx.fillRect(0,GY,NW,NH-GY);W.plats.forEach(pl=>{if(pl.t!=='g')return;const s=sx(pl.x);if(s+pl.w<0||s>NW)return;ctx.fillStyle='#1e5010';ctx.fillRect(s,pl.y,pl.w,5);ctx.fillStyle='#2e7018';ctx.fillRect(s,pl.y,pl.w,2);ctx.fillStyle='#1e5010';ctx.fillRect(s,pl.y+5,pl.w,8);ctx.fillStyle='#2e7018';ctx.fillRect(s,pl.y+5,pl.w,3);ctx.fillStyle='#2e1408';ctx.fillRect(s,pl.y+13,pl.w,pl.h-13);ctx.fillStyle='#3e2010';for(let r=0;r<4;r++)ctx.fillRect(s,pl.y+18+r*11,pl.w,2);});}
function drawPlatforms(){W.plats.filter(p=>p.t==='p'||p.t==='b').forEach(pl=>{const s=sx(pl.x);if(s+pl.w<-4||s>NW+4)return;if(pl.t==='p'){ctx.fillStyle='#404840';ctx.fillRect(s,pl.y,pl.w,14);ctx.fillStyle='#606e58';ctx.fillRect(s,pl.y,pl.w,4);ctx.fillStyle='#2a6e1a';ctx.fillRect(s,pl.y,pl.w,3);}else if(pl.t==='b'){ctx.fillStyle='#654321';ctx.fillRect(s,pl.y,pl.w,pl.h);ctx.fillStyle='#8b5a2b';ctx.fillRect(s,pl.y,pl.w,3);}});}
function drawCoins(){W.coins.forEach(c=>{if(c.col)return;const s=sx(c.x);if(s<-20||s>NW+20)return;c.an+=0.09;const sc=0.87+Math.sin(c.an)*0.13;ctx.fillStyle='#f4c542';ctx.beginPath();ctx.ellipse(s,c.y,7*sc,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fffaaa';ctx.beginPath();ctx.ellipse(s-2,c.y-2,2.5*sc,2.5,0,0,Math.PI*2);ctx.fill();});}
function drawEnemies(){W.enemies.forEach(e=>{const ex=sx(e.x);if(ex+e.w<-4||ex>NW+4)return;ctx.fillStyle='#8b4513';ctx.fillRect(ex,e.y,e.w,e.h);ctx.fillStyle='#a0522d';ctx.fillRect(ex,e.y,e.w,5);});}
function drawGoal(){const s=sx(W.goal.x);if(s<-40||s>NW+20)return;const gy=W.goal.y;if(Math.floor(Date.now()/500)%2){ctx.fillStyle='rgba(90,200,50,.14)';ctx.fillRect(s-20,gy-100,60,110);}ctx.fillStyle='#5a8a30';ctx.fillRect(s,gy-95,5,97);ctx.fillStyle='#7aff40';ctx.beginPath();ctx.moveTo(s+5,gy-95);ctx.lineTo(s+38,gy-78);ctx.lineTo(s+5,gy-62);ctx.fill();ctx.fillStyle='#f4c542';ctx.font='12px serif';ctx.fillText('★',s-2,gy-97);}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.col;ctx.fillRect(Math.round(sx(p.x)),Math.round(p.y),Math.round(p.sz),Math.round(p.sz));});ctx.globalAlpha=1;}
function drawMary(){if(P.dead&&P.rT<60)return;if(P.inv>0&&Math.floor(P.inv/5)%2===0)return;const s=sx(P.x),y=P.y;ctx.save();if(P.dir===-1){ctx.translate(s+P.w,y);ctx.scale(-1,1);}else ctx.translate(s,y);ctx.fillStyle='#3d1f00';ctx.fillRect(2,0,14,7);ctx.fillRect(0,4,3,8);ctx.fillStyle='#f4c542';ctx.fillRect(3,4,13,9);ctx.fillStyle='#3d1f00';ctx.fillRect(5,7,2,2);ctx.fillRect(11,7,2,2);ctx.fillStyle='#c07050';ctx.fillRect(7,11,5,2);ctx.fillStyle='#3a8fc4';ctx.fillRect(2,13,14,9);ctx.fillRect(0,14,3,6);ctx.fillRect(15,14,3,6);ctx.fillStyle='#2c2c5e';if(!P.onGround){ctx.fillRect(2,22,6,8);ctx.fillRect(10,22,6,8);}else{const l=Math.floor(P.aF/4)%2;ctx.fillRect(2,22,6,4+(l?4:0));ctx.fillRect(10,22,6,4+(l?0:4));}ctx.fillStyle='#3d1f00';ctx.fillRect(1,24,7,4);ctx.fillRect(9,24,7,4);ctx.restore();}

// ══════════════════════════════════════════════════════════════
// LOOP PRINCIPAL
// ══════════════════════════════════════════════════════════════
function loop(ts){ctx.clearRect(0,0,NW,NH);if(gState==='title'){requestAnimationFrame(loop);return;}if(gState==='playing'||gState==='won'){update();tickParts();}if(gState==='dialog'){tickDlg();tickParts();}drawSky();drawGround();drawPlatforms();drawCoins();drawEnemies();drawGoal();drawParts();drawMary();if(gState==='playing'||gState==='dialog'){ctx.fillStyle='rgba(90,200,50,.7)';ctx.font='8px "Press Start 2P"';ctx.fillText('▶ META: '+Math.max(0,Math.round((W.goal.x-P.x)/10)*10)+'m',8,16);}requestAnimationFrame(loop);}

// ══════════════════════════════════════════════════════════════
// INICIO
// ══════════════════════════════════════════════════════════════
loadLevel(1);
(function titleAnim(ts){if(gState!=='title')return;ctx.clearRect(0,0,NW,NH);const g=ctx.createLinearGradient(0,0,0,NH);g.addColorStop(0,'#061208');g.addColorStop(1,'#1a3a18');ctx.fillStyle=g;ctx.fillRect(0,0,NW,NH);const t=ts/1000;for(let i=0;i<14;i++){const fx=80+i*55+Math.sin(t*0.9+i)*35,fy=80+Math.cos(t*0.7+i*0.8)*55;ctx.fillStyle=`rgba(160,255,80,${0.35+Math.sin(t*1.8+i)*0.3})`;ctx.beginPath();ctx.arc(fx,fy,2.5,0,Math.PI*2);ctx.fill();}requestAnimationFrame(titleAnim);})(0);
</script>
